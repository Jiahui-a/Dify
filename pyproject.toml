[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andon-fetcher"
version = "0.1.0"
description = "Fetch Andon raw records via OData + API Key"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "pandas>=2.1.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "responses>=0.25.0"]

[project.scripts]
andon-fetcher = "andon_fetcher.__main__:cli"

[tool.setuptools.packages.find]
include = ["andon_fetcher*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
